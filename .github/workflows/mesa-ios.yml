name: iOS software OpenGL

on:
  workflow_dispatch:
  push:
    paths:
      - 'build/mesa-ios/**'
      - 'build/boxedwine/**'
      - 'tests/wine32/**'
      - '.github/workflows/mesa-ios.yml'

permissions:
  contents: read

concurrency:
  group: mesa-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.userAgent
  GIT_CONFIG_VALUE_0: 'OpenAI File Downloader, XaiImageApiFetch/1.0'

jobs:
  windows-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile native x86 Windows fixtures and MSI
        run: |
          sudo apt-get -o 'Acquire::http::User-Agent=OpenAI File Downloader, XaiImageApiFetch/1.0' -o 'Acquire::https::User-Agent=OpenAI File Downloader, XaiImageApiFetch/1.0' update
          sudo apt-get -o 'Acquire::http::User-Agent=OpenAI File Downloader, XaiImageApiFetch/1.0' -o 'Acquire::https::User-Agent=OpenAI File Downloader, XaiImageApiFetch/1.0' install -y gcc-mingw-w64-i686 gcc-multilib libgl-dev libglu1-mesa-dev wixl
          mkdir -p /tmp/payload
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror tests/wine32/runtime_probe.c -ladvapi32 -o /tmp/payload/probe.exe
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror tests/wine32/graphics_probe.c -ld3d9 -luser32 -o /tmp/payload/graphics.exe
          cp tests/wine32/probe.wxs tests/wine32/install.cmd /tmp/payload/
          (cd /tmp/payload && wixl -a x86 -o probe.msi probe.wxs)
      - name: Build matching i386 guest OpenGL bridge
        run: |
          python3 build/boxedwine/fetch.py --cache /tmp/boxedwine-cache --source /tmp/boxedwine-source
          python3 build/boxedwine/build_guest_graphics.py --source /tmp/boxedwine-source --output /tmp/graphics/madeira-graphics.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wine32-guest-graphics
          path: /tmp/graphics/
      - uses: actions/upload-artifact@v4
        with:
          name: x86-windows-fixtures
          path: /tmp/payload/
  osmesa:
    needs: windows-fixtures
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: x86-windows-fixtures
          path: /tmp/payload
      - uses: actions/download-artifact@v4
        with:
          name: wine32-guest-graphics
          path: /tmp/graphics
      - name: Build and link static software OpenGL for iOS
        run: |
          set -o pipefail
          python3 build/mesa-ios/build.py --sdk '${{ matrix.sdk }}' --deployment-target 17.0 2>&1 | tee /tmp/mesa-build.log
      - name: Build and link the native Wine32 interpreter for iOS
        run: |
          set -o pipefail
          export PATH="$PWD/build/mesa-ios/.work/${{ matrix.sdk }}/python/bin:$PATH"
          python3 build/boxedwine/fetch.py --cache /tmp/boxedwine-cache --source /tmp/boxedwine-source --wine /tmp/wine11.zip
          cmake -S build/boxedwine -B /tmp/boxedwine-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT='${{ matrix.sdk }}' \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DMADEIRA_SANITIZE=${{ matrix.sdk == 'iphonesimulator' && 'ON' || 'OFF' }} \
            -DBOXEDWINE_SOURCE=/tmp/boxedwine-source \
            -DWINE32_PROBE_PAYLOAD=/tmp/payload -DWINE32_PROBE_ROOTFS=/tmp/wine11.zip \
            -DWINE32_PROBE_GRAPHICS=/tmp/graphics/madeira-graphics.zip \
            -DOSMESA_ROOT="$PWD/build/mesa-ios/out/${{ matrix.sdk }}" 2>&1 | tee /tmp/wine32-ios-configure.log
          cmake --build /tmp/boxedwine-ios --parallel 3 2>&1 | tee /tmp/wine32-ios-build.log
          xcrun vtool -show-build /tmp/boxedwine-ios/madeira-wine32-ios-link
      - name: Verify production runtime packaging
        run: |
          python3 build/boxedwine/package_ios.py --build /tmp/boxedwine-ios \
            --source /tmp/boxedwine-source --mesa 'build/mesa-ios/out/${{ matrix.sdk }}' \
            --wine /tmp/wine11.zip --graphics /tmp/graphics/madeira-graphics.zip --app /tmp/packaged-wine32
      - name: Run Windows installers and Direct3D through the UIKit host
        if: matrix.sdk == 'iphonesimulator'
        run: |
          codesign --force --sign - /tmp/boxedwine-ios/MadeiraWine32Probe.app/Frameworks/libclang_rt.asan_iossim_dynamic.dylib
          codesign --force --sign - /tmp/boxedwine-ios/MadeiraWine32Probe.app
          export SIMCTL_CHILD_ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          python3 tests/wine32/ios/run_simulator.py --app /tmp/boxedwine-ios/MadeiraWine32Probe.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osmesa-${{ matrix.sdk }}
          path: |
            build/mesa-ios/out/${{ matrix.sdk }}/
            build/mesa-ios/.work/${{ matrix.sdk }}/build/meson-logs/
            build/mesa-ios/.work/${{ matrix.sdk }}/link-commands.txt
            /tmp/mesa-build.log
            /tmp/wine32-ios-*.log
            /tmp/wine32-ios-*.json
            /tmp/wine32-ios-*.png
            /tmp/wine32-ios-crash-*
            /tmp/boxedwine-ios/CMakeFiles/CMakeConfigureLog.yaml
            /tmp/boxedwine-ios/libmadeira-wine32-engine.a
            /tmp/boxedwine-ios/libbw_softfloat.a
            /tmp/boxedwine-ios/sdl2/libSDL2.a
            /tmp/boxedwine-ios/madeira-wine32-ios-link
