name: Wine32 execution backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'build/boxedwine/**'
      - 'tests/wine32/**'
      - '.github/workflows/wine32-runtime.yml'

permissions:
  contents: read

jobs:
  interpreter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libsdl2-dev libgl-dev zlib1g-dev gcc-mingw-w64-i686 xvfb
      - uses: actions/cache@v4
        with:
          path: .wine32-cache
          key: wine32-inputs-${{ hashFiles('build/boxedwine/runtime.json') }}
      - name: Fetch pinned source and complete Wine32 filesystem
        run: python3 build/boxedwine/fetch.py --cache .wine32-cache --source /tmp/boxedwine-source --wine .wine32-cache/wine11.zip
      - name: Build native interpreter
        run: |
          cmake -S build/boxedwine -B /tmp/boxedwine-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DBOXEDWINE_SOURCE=/tmp/boxedwine-source
          cmake --build /tmp/boxedwine-build --parallel 2
      - name: Compile an actual x86 Windows probe
        run: |
          mkdir -p /tmp/wine32-probe /tmp/wine32-prefix
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror tests/wine32/runtime_probe.c -ladvapi32 -o /tmp/wine32-probe/probe.exe
          python3 tools/inspect-windows-executable.py /tmp/wine32-probe/probe.exe
      - name: Execute probe through emulated Wine32
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout 240 xvfb-run -a /tmp/boxedwine-build/madeira-wine32 \
            -root /tmp/wine32-prefix -zip "$PWD/.wine32-cache/wine11.zip" \
            -mount_drive /tmp/wine32-probe d -disableLinearMemory -nosound -env WINEDEBUG=-all \
            /bin/wine 'D:\probe.exe' 2>&1 | tee /tmp/wine32-runtime.log
          python3 - <<'PY'
          from pathlib import Path
          assert Path('/tmp/wine32-probe/32 bit result.txt').read_text() == 'native-x86-wine-memory-threads-registry-file-ok\n'
          print('Real x86 PE executed memory, thread, registry and file APIs through Wine32')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine32-runtime-log
          path: /tmp/wine32-runtime.log
