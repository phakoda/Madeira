name: Wine32 execution backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'build/boxedwine/**'
      - 'tests/wine32/**'
      - '.github/workflows/wine32-runtime.yml'

permissions:
  contents: read

concurrency:
  group: wine32-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.userAgent
  GIT_CONFIG_VALUE_0: 'OpenAI File Downloader, XaiImageApiFetch/1.0'
  ASAN_OPTIONS: detect_leaks=0

jobs:
  interpreter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get -o 'Acquire::http::User-Agent=OpenAI File Downloader, XaiImageApiFetch/1.0' -o 'Acquire::https::User-Agent=OpenAI File Downloader, XaiImageApiFetch/1.0' update
          sudo apt-get -o 'Acquire::http::User-Agent=OpenAI File Downloader, XaiImageApiFetch/1.0' -o 'Acquire::https::User-Agent=OpenAI File Downloader, XaiImageApiFetch/1.0' install -y clang cmake ninja-build libsdl2-dev libgl-dev zlib1g-dev gcc-mingw-w64-i686 gcc-multilib libglu1-mesa-dev xvfb wixl imagemagick
      - uses: actions/cache@v4
        with:
          path: .wine32-cache
          key: wine32-inputs-${{ hashFiles('build/boxedwine/runtime.json') }}
      - name: Fetch pinned source and complete Wine32 filesystem
        run: python3 build/boxedwine/fetch.py --cache .wine32-cache --source /tmp/boxedwine-source --wine .wine32-cache/wine11.zip
      - name: Build matching guest OpenGL bridge
        run: python3 build/boxedwine/build_guest_graphics.py --source /tmp/boxedwine-source --output /tmp/madeira-graphics.zip
      - name: Build native interpreter
        run: |
          cmake -S build/boxedwine -B /tmp/boxedwine-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DBOXEDWINE_SOURCE=/tmp/boxedwine-source -DMADEIRA_SANITIZE=ON
          cmake --build /tmp/boxedwine-build --parallel 2
      - name: Compile an actual x86 Windows probe
        run: |
          mkdir -p /tmp/wine32-probe /tmp/wine32-prefix
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror tests/wine32/runtime_probe.c -ladvapi32 -o /tmp/wine32-probe/probe.exe
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror tests/wine32/graphics_probe.c -ld3d9 -luser32 -o /tmp/wine32-probe/graphics.exe
          cp tests/wine32/probe.wxs /tmp/wine32-probe/
          cp tests/wine32/install.cmd /tmp/wine32-probe/
          (cd /tmp/wine32-probe && wixl -a x86 -o probe.msi probe.wxs)
          python3 tools/inspect-windows-executable.py /tmp/wine32-probe/probe.exe
      - name: Execute probe through emulated Wine32
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python3 tests/wine32/run_native.py --engine /tmp/boxedwine-build/madeira-wine32 \
            --rootfs "$PWD/.wine32-cache/wine11.zip" --graphics-rootfs /tmp/madeira-graphics.zip --prefix /tmp/wine32-prefix --payload /tmp/wine32-probe \
            --name runtime --result '/tmp/wine32-probe/32 bit result.txt' \
            --expected native-x86-wine-memory-threads-registry-file-ok -- /bin/wine 'D:\probe.exe'
      - name: Restart embedded guest in the same host process
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p /tmp/wine32-lifecycle-prefix
          xvfb-run -a timeout 60 /tmp/boxedwine-build/madeira-wine32 --host-repeat-twice \
            -root /tmp/wine32-lifecycle-prefix -zip /tmp/madeira-graphics.zip -zip "$PWD/.wine32-cache/wine11.zip" \
            -mount_drive /tmp/wine32-probe d -nosound /bin/sh -c 'echo restarted >> /mnt/drive_d/lifecycle.txt'
          python3 - <<'PY'
          from pathlib import Path
          assert Path('/tmp/wine32-probe/lifecycle.txt').read_text().splitlines() == ['restarted', 'restarted']
          PY
      - name: Install MSI and launch its installed executable
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python3 tests/wine32/run_native.py --engine /tmp/boxedwine-build/madeira-wine32 \
            --rootfs "$PWD/.wine32-cache/wine11.zip" --graphics-rootfs /tmp/madeira-graphics.zip --prefix /tmp/wine32-prefix --payload /tmp/wine32-probe \
            --name msi --result /tmp/wine32-probe/installer-result.txt --expected msi-installed-ok \
            -- /bin/wine cmd /c 'D:\install.cmd'
          xvfb-run -a python3 tests/wine32/run_native.py --engine /tmp/boxedwine-build/madeira-wine32 \
            --rootfs "$PWD/.wine32-cache/wine11.zip" --graphics-rootfs /tmp/madeira-graphics.zip --prefix /tmp/wine32-prefix --payload /tmp/wine32-probe \
            --name installed --result '/tmp/wine32-probe/32 bit result.txt' \
            --expected native-x86-wine-memory-threads-registry-file-ok -- /bin/wine 'C:\Program Files\Madeira32Probe\probe.exe'
      - name: Verify x86 Direct3D 9 rendering and Windows callback
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python3 tests/wine32/run_native.py --engine /tmp/boxedwine-build/madeira-wine32 \
            --rootfs "$PWD/.wine32-cache/wine11.zip" --graphics-rootfs /tmp/madeira-graphics.zip --prefix /tmp/wine32-prefix --payload /tmp/wine32-probe \
            --name graphics --result '/tmp/wine32-probe/graphics result.txt' \
            --expected native-x86-d3d9-render-target-pixels-ok -- /bin/wine 'D:\graphics.exe'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine32-runtime-log
          path: |
            /tmp/wine32-*.log
            /tmp/wine32-*.png
